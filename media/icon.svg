<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor">
  <!-- Terminal Window Frame -->
  <rect x="2.5" y="3" width="19" height="18" rx="3.2" stroke-width="1.6" stroke-linejoin="round" />
  <line x1="2.5" y1="7.2" x2="21.5" y2="7.2" stroke-width="1.2" />
  
  <!-- Window Control Dots -->
  <circle cx="5.2" cy="5.1" r="0.75" fill="currentColor" stroke="none" />
  <circle cx="7.4" cy="5.1" r="0.75" fill="currentColor" stroke="none" />
  <circle cx="9.6" cy="5.1" r="0.75" fill="currentColor" stroke="none" />

  <!-- Anthropic Claude 8-pointed Spark Core (Center: 12, 14.2) -->
  <g stroke-linecap="round">
    <!-- Orthogonal Rays -->
    <line x1="12" y1="9.5" x2="12" y2="18.9" stroke-width="2.1" />
    <line x1="7.3" y1="14.2" x2="16.7" y2="14.2" stroke-width="2.1" />
    <!-- Diagonal Rays -->
    <line x1="8.7" y1="10.9" x2="15.3" y2="17.5" stroke-width="1.8" />
    <line x1="8.7" y1="17.5" x2="15.3" y2="10.9" stroke-width="1.8" />
  </g>
  <!-- Spark Center Node -->
  <circle cx="12" cy="14.2" r="1.4" fill="currentColor" stroke="none" />
</svg>
