<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor">
  <!-- Terminal Window Frame -->
  <rect x="2" y="2" width="20" height="20" rx="3.5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
  <line x1="2" y1="6.8" x2="22" y2="6.8" stroke="currentColor" stroke-width="1.2" />
  
  <!-- Window Control Dots -->
  <circle cx="4.8" cy="4.4" r="0.75" fill="#FF5F56" />
  <circle cx="6.8" cy="4.4" r="0.75" fill="#FFBD2E" />
  <circle cx="8.8" cy="4.4" r="0.75" fill="#27C93F" />

  <!-- Anthropic Claude 8-pointed Spark Core (Center: 12, 14.4) -->
  <g stroke="#D97757" stroke-linecap="round">
    <!-- Orthogonal Rays -->
    <line x1="12" y1="9.5" x2="12" y2="19.3" stroke-width="2.1" />
    <line x1="7.1" y1="14.4" x2="16.9" y2="14.4" stroke-width="2.1" />
    <!-- Diagonal Rays -->
    <line x1="8.5" y1="10.9" x2="15.5" y2="17.9" stroke-width="1.8" />
    <line x1="8.5" y1="17.9" x2="15.5" y2="10.9" stroke-width="1.8" />
  </g>
  <!-- Spark Center Node -->
  <circle cx="12" cy="14.4" r="1.4" fill="#D97757" />
</svg>
